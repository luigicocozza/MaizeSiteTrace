project:
  name: "ai_ncrna_rnaseq_rnacentral_backbone"
  version: "1.0"
  description: "AI-driven identification and functional annotation of ncRNAs from RNA-seq using RNAcentral as the primary knowledge backbone"
  mode: "public_data_only"
  task:
    - candidate_extraction_from_rnaseq
    - ncrna_classification
    - similarity_search
    - knowledge_retrieval

paths:
  base_dir: "."
  raw_dir: "data/raw"
  external_dir: "data/external"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  indexes_dir: "data/indexes"
  models_dir: "models"
  outputs_dir: "outputs"
  logs_dir: "logs"

runtime:
  random_seed: 42
  num_threads: 8
  use_gpu: true
  device: "cuda"
  force_redownload: false
  resume_partial_downloads: true
  log_level: "INFO"

scope:
  taxonomy_scope: "Eukaryota"
  recommended_override_for_plant_projects: "Viridiplantae"
  max_sequences_per_class_train: 200000
  max_sequences_per_class_val: 20000
  max_sequences_per_class_test: 20000
  deduplicate_sequences: true
  min_sequence_length: 18
  max_sequence_length: 10000

reference_databases:
  rnacentral:
    enabled: true
    role:
      - primary_training_backbone
      - master_identifier_space
      - cross_reference_lookup
      - sequence_similarity_target
    homepage: "https://rnacentral.org/"
    downloads_page: "https://rnacentral.org/downloads"
    ftp_base: "https://ftp.ebi.ac.uk/pub/databases/RNAcentral"
    current_release_fasta: "https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/sequences/rnacentral_active.fasta.gz"
    api_base: "https://rnacentral.org/api"
    use_api_for_metadata: true
    use_bulk_fasta_for_training: true

  rfam:
    enabled: true
    role:
      - family_labels
      - clan_labels
      - structure_aware_family_support
    homepage: "https://rfam.org/"
    ftp_help: "https://docs.rfam.org/en/latest/ftp-help.html"
    current_fasta: "https://ftp.ebi.ac.uk/pub/databases/Rfam/CURRENT/fasta_files/Rfam.fa.gz"
    release: "CURRENT"
    use_for_family_mapping: true
    use_for_secondary_family_validation: true

  mirbase:
    enabled: true
    role:
      - high_confidence_mirna_support
      - mirna_hairpin_sequences
      - mirna_mature_sequences
    homepage: "https://www.mirbase.org/"
    download_page: "https://www.mirbase.org/download/"
    current_release_root: "https://www.mirbase.org/download/CURRENT/"
    hairpin_fasta: "https://www.mirbase.org/download/CURRENT/hairpin.fa"
    mature_fasta: "https://www.mirbase.org/download/CURRENT/mature.fa"
    release: "22.1"
    use_for_mirna_calibration: true

  noncode:
    enabled: true
    role:
      - lncRNA_support
      - external_lncRNA_reference
    homepage: "https://v5.noncode.org/"
    download_page: "https://v5.noncode.org/download.php"
    version: "5.0"
    use_for_lncRNA_support_only: true

  mirgenedb:
    enabled: false
    role:
      - optional_high_confidence_mirna_curated_support
    homepage: "https://mirgenedb.org/"
    download_page: "https://mirgenedb.org/download"
    note: "Enable only if you want a stricter manually curated miRNA subset in addition to miRBase"

  gtrnadb:
    enabled: false
    role:
      - optional_trna_reference_support
    homepage: "https://gtrnadb.ucsc.edu/"
    note: "Optional because RNAcentral already covers tRNAs; enable if you want a dedicated tRNA support database"

  silva:
    enabled: false
    role:
      - optional_rrna_reference_support
    homepage: "https://www.arb-silva.de/"
    note: "Optional because RNAcentral already covers rRNAs; enable if you want a dedicated rRNA support database"

training_data_strategy:
  primary_source: "RNAcentral"
  primary_sequence_source: "rnacentral.current_release_fasta"
  class_sources:
    miRNA:
      primary: "RNAcentral"
      support:
        - "miRBase"
        - "Rfam"
    lncRNA:
      primary: "RNAcentral"
      support:
        - "NONCODE"
    snoRNA:
      primary: "RNAcentral"
      support:
        - "Rfam"
    snRNA:
      primary: "RNAcentral"
      support:
        - "Rfam"
    tRNA:
      primary: "RNAcentral"
      support: []
    rRNA:
      primary: "RNAcentral"
      support: []
    OTHER:
      primary: "synthetic_decoy_generation"
      support: []
  target_classes:
    - "miRNA"
    - "lncRNA"
    - "snoRNA"
    - "snRNA"
    - "tRNA"
    - "rRNA"
    - "OTHER"
  other_class_strategy:
    method: "fragment_and_decoy"
    description: "Generate OTHER from sequence fragments, hard negatives and low-confidence/unmatched candidates rather than from a dedicated ncRNA database"
    include_random_fragments: true
    include_shuffled_sequences: true
    include_unmatched_rnaseq_candidates: true

preprocessing:
  uppercase_sequences: true
  convert_T_to_U: true
  remove_duplicate_headers: true
  remove_duplicate_sequences: true
  filter_ambiguous_bases: false
  max_fraction_ambiguous_bases: 0.05
  keep_only_rna_alphabet_after_conversion: true
  chunking:
    enabled: true
    min_chunk_len: 18
    max_chunk_len: 200
    overlap: 0
    use_for_domain_shift_augmentation: true
  augmentation:
    enabled: true
    random_subsequence_crop: true
    edge_trim_noise: true
    class_balance_undersampling: true
    class_balance_oversampling: false

labeling:
  source_priority:
    - "RNAcentral"
    - "Rfam"
    - "miRBase"
    - "NONCODE"
  label_column_name: "label"
  confidence_column_name: "label_confidence"
  source_column_name: "label_source"
  split_column_name: "split"
  label_mapping:
    miRNA: 0
    lncRNA: 1
    snoRNA: 2
    snRNA: 3
    tRNA: 4
    rRNA: 5
    OTHER: 6
  minimum_label_confidence_for_training: 0.70
  assign_other_if_unresolved: true
  unresolved_to_other_min_confidence: 0.50

model:
  embeddings:
    provider: "huggingface"
    model_name: "InstaDeepAI/nucleotide-transformer-v2-100m-multi-species"
    pooling: "mean"
    batch_size: 32
    max_length: 1024
    normalize_embeddings: true
  classifier:
    primary_model: "xgboost"
    fallback_model: "random_forest"
    class_weighting: true
    use_probability_outputs: true
    confidence_threshold: 0.60
  train_val_test_split:
    train: 0.80
    val: 0.10
    test: 0.10
    stratify_by_label: true

similarity_search:
  baseline:
    enabled: true
    method: "blastn"
    database_name: "rnacentral_active"
    evalue: 1.0e-5
    max_target_seqs: 20
  advanced:
    enabled: true
    method: "faiss"
    faiss_metric: "cosine"
    top_k: 20
    build_local_index_from_rnacentral_embeddings: true

knowledge_retrieval:
  rnacentral_api:
    enabled: true
    api_base: "https://rnacentral.org/api"
    retrieve_fields:
      - "rna_type"
      - "description"
      - "expert_databases"
      - "xrefs"
      - "species"
  literature:
    enabled: true
    provider: "Europe PMC"
    articles_api: "https://europepmc.org/RestfulWebService"
    max_articles_per_hit: 10
  ontology:
    enabled: true
    provider: "QuickGO"
    api_base: "https://www.ebi.ac.uk/QuickGO/api"
  pathways:
    enabled: true
    provider: "Reactome"
    api_base: "https://reactome.org/ContentService"

rnaseq_processing:
  enabled: true
  input_type:
    - "FASTQ"
    - "FASTA_candidates"
  qc_tool: "FastQC"
  trimming_tool: "Trimmomatic"
  mapping_tool_options:
    - "STAR"
    - "HISAT2"
  assembly_tool_options:
    - "StringTie"
    - "Trinity"
  candidate_fasta_output: "data/interim/rnaseq_candidates.fasta"
  use_candidates_for_other_class: true

pipeline_outputs:
  training_sequences_fasta: "data/processed/training_sequences.fasta"
  training_labels_tsv: "data/processed/training_labels.tsv"
  similarity_index_dir: "data/indexes/rnacentral_faiss"
  final_candidate_fasta: "outputs/candidate_sequences.fasta"
  final_classification_tsv: "outputs/ncrna_classification.tsv"
  final_similarity_tsv: "outputs/rnacentral_similarity.tsv"
  final_annotation_tsv: "outputs/ncrna_annotation.tsv"
  final_report_json: "outputs/pipeline_report.json"

quality_control:
  min_sequences_per_class_after_filtering: 1000
  warn_if_class_imbalance_ratio_above: 20
  fail_if_missing_primary_backbone_sequences: true
  fail_if_rnacentral_download_empty: true
  validate_required_columns: true
  save_summary_tables: true

reproducibility:
  save_download_manifest: true
  save_dataset_manifest: true
  save_label_provenance: true
  save_filtering_stats: true
  save_config_copy_in_outputs: true

notes:
  rationale:
    - "RNAcentral is the primary backbone because it aggregates ncRNA sequences and cross-references from dozens of expert databases."
    - "Rfam is used to enrich family-level supervision and downstream biological interpretation."
    - "miRBase is enabled to strengthen the miRNA class with high-confidence hairpin and mature sequences."
    - "NONCODE is enabled as support for lncRNA labels."
    - "OTHER is generated as a proxy class using decoys, fragments and unresolved RNA-seq candidates, exactly because a universal curated OTHER database does not exist."
  recommendation:
    - "Keep taxonomy_scope as Eukaryota for a generic ncRNA project."
    - "Switch taxonomy_scope to Viridiplantae if the project is plant-specific."